<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Book Stall</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, sans-serif;
    }

    body{
      background:#f1f3f6;
    }

    /* Navbar */
    .navbar{
      background:#2874f0;
      color:white;
      padding:15px 30px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      position:sticky;
      top:0;
      z-index:100;
    }

    .logo{
      font-size:28px;
      font-weight:bold;
    }

    .search-box{
      width:45%;
    }

    .search-box input{
      width:100%;
      padding:10px;
      border:none;
      border-radius:5px;
      outline:none;
    }

    .nav-links a{
      color:white;
      text-decoration:none;
      margin-left:20px;
      font-size:18px;
    }

    /* Banner */
    .banner{
      width:100%;
      height:300px;
      overflow:hidden;
    }

    .banner img{
      width:100%;
      height:100%;
      object-fit:cover;
    }

    /* Section Title */
    .section-title{
      padding:20px;
      font-size:28px;
      color:#333;
      font-weight:bold;
    }

    /* Book Container */
    .book-container{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
      gap:20px;
      padding:20px;
    }

    /* Book Card */
    .book-card{
      background:white;
      border-radius:10px;
      overflow:hidden;
      transition:0.3s;
      box-shadow:0 2px 8px rgba(0,0,0,0.1);
    }

    .book-card:hover{
      transform:translateY(-5px);
    }

    .book-card img{
      width:100%;
      height:250px;
      object-fit:cover;
    }

    .book-info{
      padding:15px;
      text-align:center;
    }

    .book-info h3{
      margin-bottom:10px;
      color:#222;
    }

    .price{
      color:green;
      font-size:20px;
      font-weight:bold;
      margin-bottom:10px;
    }

    .btn{
      background:#ff9f00;
      border:none;
      padding:10px 20px;
      color:white;
      border-radius:5px;
      cursor:pointer;
      font-size:16px;
    }

    .btn:hover{
      background:#fb641b;
    }

    /* Footer */
    footer{
      background:#172337;
      color:white;
      text-align:center;
      padding:20px;
      margin-top:30px;
    }

    /* Responsive */
    @media(max-width:768px){

      .navbar{
        flex-direction:column;
        gap:15px;
      }

      .search-box{
        width:100%;
      }

      .nav-links{
        display:flex;
        gap:15px;
      }

      .banner{
        height:200px;
      }
    }
  </style>
</head>

<body>

  <!-- Navbar -->
  <nav class="navbar">

    <div class="logo">📚 Book Stall</div>

    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Search books...">
    </div>

    <div class="nav-links">
      <a href="#">Home</a>
      <a href="#">Books</a>
      <a href="#">Offers</a>
      <a href="#">Contact</a>
    </div>

  </nav>

  <!-- Banner -->
  <div class="banner">
    <img src="https://images.unsplash.com/photo-1524995997946-a1c2e315a42f" alt="Books Banner">
  </div>

  <!-- Title -->
  <div class="section-title">
    Popular Books
  </div>

  <!-- Books -->
  <div class="book-container" id="bookContainer">

    <!-- Book 1 -->
    <div class="book-card">
      <img src="https://images.unsplash.com/photo-1544947950-fa07a98d237f" alt="">
      <div class="book-info">
        <h3>Java Programming</h3>
        <div class="price">₹499</div>
        <button class="btn" onclick="buyBook('Java Programming')">
          Buy Now
        </button>
      </div>
    </div>

    <!-- Book 2 -->
    <div class="book-card">
      <img src="https://images.unsplash.com/photo-1512820790803-83ca734da794" alt="">
      <div class="book-info">
        <h3>Python Basics</h3>
        <div class="price">₹399</div>
        <button class="btn" onclick="buyBook('Python Basics')">
          Buy Now
        </button>
      </div>
    </div>

    <!-- Book 3 -->
    <div class="book-card">
      <img src="https://images.unsplash.com/photo-1495446815901-a7297e633e8d" alt="">
      <div class="book-info">
        <h3>Web Development</h3>
        <div class="price">₹599</div>
        <button class="btn" onclick="buyBook('Web Development')">
          Buy Now
        </button>
      </div>
    </div>

    <!-- Book 4 -->
    <div class="book-card">
      <img src="https://images.unsplash.com/photo-1516979187457-637abb4f9353" alt="">
      <div class="book-info">
        <h3>Data Science</h3>
        <div class="price">₹699</div>
        <button class="btn" onclick="buyBook('Data Science')">
          Buy Now
        </button>
      </div>
    </div>

    <!-- Book 5 -->
    <div class="book-card">
      <img src="https://images.unsplash.com/photo-1519682337058-a94d519337bc" alt="">
      <div class="book-info">
        <h3>Machine Learning</h3>
        <div class="price">₹799</div>
        <button class="btn" onclick="buyBook('Machine Learning')">
          Buy Now
        </button>
      </div>
    </div>

    <!-- Book 6 -->
    <div class="book-card">
      <img src="https://images.unsplash.com/photo-1521587760476-6c12a4b040da" alt="">
      <div class="book-info">
        <h3>Cloud Computing</h3>
        <div class="price">₹550</div>
        <button class="btn" onclick="buyBook('Cloud Computing')">
          Buy Now
        </button>
      </div>
    </div>

  </div>

  <!-- Footer -->
  <footer>
    © 2026 Book Stall | Designed Like Flipkart Style
  </footer>

  <!-- JavaScript -->
  <script>

    // Buy Button
    function buyBook(bookName){
      alert(bookName + " added to cart!");
    }

    // Search Function
    const searchInput = document.getElementById("searchInput");

    searchInput.addEventListener("keyup", function(){

      let filter = searchInput.value.toLowerCase();

      let cards = document.querySelectorAll(".book-card");

      cards.forEach(function(card){

        let title = card.querySelector("h3").innerText.toLowerCase();

        if(title.includes(filter)){
          card.style.display = "block";
        }
        else{
          card.style.display = "none";
        }

      });

    });

  </script>

</body>
</html>
